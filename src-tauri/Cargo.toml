[package]
name = "teerm"
version = "0.1.0"
description = "A local-first desktop SSH client"
authors = ["Teerm"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "teerm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
argon2 = "0.6.0"
chacha20poly1305 = "0.11.0"
rand = "0.10.3"
base64 = "0.23.1"
zeroize = "1.9.1"
uuid = { version = "1.29.0", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net"] }
getrandom = "0.4.3"
ssh-key = { version = "0.6.7", features = ["ed25519", "rsa", "ecdsa", "encryption", "rand_core"] }
russh = "0.65"
russh-sftp = "3.0.1"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
